name: Deploy to Tigris

on:
  push:
    tags: ["v*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: "${{ secrets.API_BASE_URL }}"
      POSTHOG_KEY: "${{ secrets.POSTHOG_PROJECT_TOKEN }}"
      OTEL_ENDPOINT: "${{ secrets.OTEL_ENDPOINT }}"
      OTEL_AUTH: "${{ secrets.OTEL_AUTH }}"
      ALLOWLIST: '${{ secrets.ALLOWLIST || ''["*"]'' }}'
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate testnet config inputs
        run: |
          set -euo pipefail
          for var in API_BASE_URL OTEL_ENDPOINT OTEL_AUTH ALLOWLIST; do
            if [ -z "${!var}" ]; then
              echo "::error::Required env var $var is empty"
              exit 1
            fi
          done
          for var in API_BASE_URL OTEL_ENDPOINT; do
            val="${!var}"
            case "$val" in
              https://*) ;;
              *) echo "::error::$var must start with https:// (got: $val)"; exit 1 ;;
            esac
          done
          case "$ALLOWLIST" in
            \[*\]) ;;
            *) echo "::error::ALLOWLIST is not a JSON array (got: $ALLOWLIST)"; exit 1 ;;
          esac
          case "$OTEL_AUTH" in
            "Basic "*) ;;
            *) echo "::error::OTEL_AUTH must start with 'Basic ' (got prefix: ${OTEL_AUTH:0:6})"; exit 1 ;;
          esac

      - name: Generate production config
        run: |
          cat > public/config.js << EOF
          window.__CONSOLE_CONFIG__ = {
            apiBaseUrl: "$API_BASE_URL",
            environment: "production",
            posthogKey: "$POSTHOG_KEY",
            posthogHost: "https://us.i.posthog.com",
            allowlist: $ALLOWLIST,
            otelEndpoint: "$OTEL_ENDPOINT",
            otelAuth: "$OTEL_AUTH",
          };
          EOF

      - name: Build production bundle
        run: deno task build -- --production

      - name: Deploy to Tigris (testnet)
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.TIGRIS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}"
          AWS_REGION: auto
        run: |
          aws s3 sync public/ s3://provider-console/ \
            --endpoint-url https://fly.storage.tigris.dev \
            --acl public-read \
            --delete \
            --no-progress

  deploy-mainnet:
    runs-on: ubuntu-latest
    environment: mainnet
    env:
      API_BASE_URL: "${{ secrets.MAINNET_API_BASE_URL }}"
      STELLAR_NETWORK: "${{ secrets.MAINNET_STELLAR_NETWORK }}"
      POSTHOG_KEY: "${{ secrets.POSTHOG_PROJECT_TOKEN }}"
      OTEL_ENDPOINT: "${{ secrets.MAINNET_OTEL_ENDPOINT }}"
      OTEL_AUTH: "${{ secrets.MAINNET_OTEL_AUTH }}"
      ALLOWLIST: '${{ secrets.MAINNET_ALLOWLIST || ''["*"]'' }}'
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate mainnet config inputs
        run: |
          set -euo pipefail
          for var in API_BASE_URL STELLAR_NETWORK OTEL_ENDPOINT OTEL_AUTH ALLOWLIST; do
            if [ -z "${!var}" ]; then
              echo "::error::Required env var $var is empty"
              exit 1
            fi
          done
          case "$STELLAR_NETWORK" in
            testnet|mainnet) ;;
            *) echo "::error::STELLAR_NETWORK must be 'testnet' or 'mainnet' (got: $STELLAR_NETWORK)"; exit 1 ;;
          esac
          for var in API_BASE_URL OTEL_ENDPOINT; do
            val="${!var}"
            case "$val" in
              https://*) ;;
              *) echo "::error::$var must start with https:// (got: $val)"; exit 1 ;;
            esac
          done
          case "$ALLOWLIST" in
            \[*\]) ;;
            *) echo "::error::ALLOWLIST is not a JSON array (got: $ALLOWLIST)"; exit 1 ;;
          esac
          case "$OTEL_AUTH" in
            "Basic "*) ;;
            *) echo "::error::OTEL_AUTH must start with 'Basic ' (got prefix: ${OTEL_AUTH:0:6})"; exit 1 ;;
          esac

      - name: Generate mainnet config
        run: |
          cat > public/config.js << EOF
          window.__CONSOLE_CONFIG__ = {
            apiBaseUrl: "$API_BASE_URL",
            environment: "production",
            stellarNetwork: "$STELLAR_NETWORK",
            posthogKey: "$POSTHOG_KEY",
            posthogHost: "https://us.i.posthog.com",
            allowlist: $ALLOWLIST,
            otelEndpoint: "$OTEL_ENDPOINT",
            otelAuth: "$OTEL_AUTH",
          };
          EOF

      - name: Build production bundle
        run: deno task build -- --production

      - name: Deploy to Tigris (mainnet)
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.MAINNET_TIGRIS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MAINNET_TIGRIS_SECRET_ACCESS_KEY }}"
          AWS_REGION: auto
        run: |
          aws s3 sync public/ s3://mainnet-provider-console/ \
            --endpoint-url https://fly.storage.tigris.dev \
            --acl public-read \
            --delete \
            --no-progress
